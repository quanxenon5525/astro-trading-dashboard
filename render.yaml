services:
  - type: web
    name: astro-trading-dashboard
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/patch_og_tags.py
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.enableCORS false --server.enableXsrfProtection false
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_BASE_URL
        value: https://astro-trading-dashboard.onrender.com
