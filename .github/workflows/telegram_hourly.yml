name: Telegram Hourly Energy Check

on:
  schedule:
    # Chay vao phut 0 moi gio (UTC) - vi VN la UTC+7 co dinh (khong DST),
    # moc gio VN cung luon roi dung vao phut 0, khong bi lech.
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python telegram_notifier.py hourly
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
