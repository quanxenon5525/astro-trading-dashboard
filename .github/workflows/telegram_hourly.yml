name: Telegram Hourly Energy Check

on:
  schedule:
    # Chay vao PHUT 7 moi gio (UTC), KHONG phai phut 0. Theo tai lieu
    # chinh thuc cua GitHub, lich chay dung vao phut 0 (dau moi gio) la
    # thoi diem TAI CAO NHAT toan he thong GitHub Actions, de bi tre hoac
    # bi BO QUA hoan toan - day rat co the la ly do lich hang gio chua
    # tung tu chay lan nao. Chay o phut 7 khong anh huong logic, vi
    # build_hourly_alert() chi so sanh theo GIO (now.hour), khong quan
    # tam phut le, nen van xac dinh dung khung gio song manh bat dau.
    - cron: "7 * * * *"
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python telegram_notifier.py hourly
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
