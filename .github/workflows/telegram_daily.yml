name: Telegram Daily Digest

on:
  schedule:
    # 23:07 UTC (ngay hom truoc) = 06:07 gio Viet Nam (vi UTC+7, 23:07 UTC
    # + 7 gio = 06:07 ngay hom sau - cach tinh nay hoan toan binh thuong,
    # cron luon tinh theo UTC). Van co y LECH 7 PHUT (khong dung "0") vi
    # theo tai lieu chinh thuc cua GitHub, lich chay dung PHUT 0 la thoi
    # diem TAI CAO NHAT toan he thong, de bi tre/bo qua - nhat la voi repo
    # public/free bi uu tien thap hon repo tra phi.
    - cron: "7 23 * * *"
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python telegram_notifier.py daily
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
