name: Telegram Daily Digest

on:
  schedule:
    # 00:07 UTC = 07:07 gio Viet Nam. CO Y LECH 7 PHUT thay vi dung "0 0"
    # (dung gio, dau ngay): theo tai lieu chinh thuc cua GitHub, cac lich
    # chay dung vao PHUT 0 (dau moi gio) la thoi diem TAI CAO NHAT tren
    # toan he thong GitHub Actions, de bi tre hoac BI BO QUA hoan toan (nhat
    # la voi repo public/free, uu tien thap hon repo tra phi). Day rat co
    # the la ly do lich 7h sang chua tung tu chay duoc lan nao.
    - cron: "7 0 * * *"
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python telegram_notifier.py daily
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
